name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  test:
    name: Test + Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew compileJava compileTestJava

      - name: Run tests + coverage
        run: ./gradlew test jacocoTestReport jacocoTestCoverageVerification

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: build/reports/tests/
          retention-days: 14

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: build/reports/jacoco/
          retention-days: 14

      - name: Coverage summary
        if: always()
        run: |
          awk -F',' '
            NR > 1 {
              instructions += $4 + $5
              covered     += $5
              branches    += $6 + $7
              bcovered    += $7
              lines       += $8 + $9
              lcovered    += $9
            }
            END {
              printf "## Coverage Summary\n\n"
              printf "| Metric       | Covered | Total   | Percentage |\n"
              printf "|--------------|---------|---------|------------|\n"
              if (lines > 0)
                printf "| Lines        | %d  | %d | %.2f%%     |\n", lcovered, lines, 100*lcovered/lines
              if (branches > 0)
                printf "| Branches     | %d  | %d | %.2f%%     |\n", bcovered, branches, 100*bcovered/branches
              if (instructions > 0)
                printf "| Instructions | %d  | %d | %.2f%%     |\n", covered, instructions, 100*covered/instructions
            }
          ' build/reports/jacoco/test/jacocoTestReport.csv >> "$GITHUB_STEP_SUMMARY"

  checkstyle:
    name: Checkstyle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew checkstyleMain

      - name: Upload Checkstyle report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkstyle-report
          path: build/reports/checkstyle/
          retention-days: 14

  javac:
    name: javac (no Gradle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Compile main sources with javac
        run: |
          mkdir -p out-javac
          find src -name '*.java' \
            ! -name '*Test.java' \
            ! -name '*TestHelpers.java' \
            ! -name 'OilExample.java' > sources.txt
          javac -encoding UTF-8 -Xlint:none \
            -d out-javac -cp "lib/*" @sources.txt

  spotbugs:
    name: SpotBugs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew spotbugsMain

      - name: Upload SpotBugs report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spotbugs-report
          path: build/reports/spotbugs/
          retention-days: 14

  spotless:
    name: Spotless (format)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4

      - run: ./gradlew spotlessCheck

  docs:
    name: Docs (AqlHelp + AqlExamples)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4

      - name: Generate CQL manual
        run: ./gradlew generateHelp

      - name: Verify docs generated properly
        run: |
          set -euo pipefail
          test -d help || { echo "::error::help/ was not produced"; exit 1; }
          for f in index.html syntax.html options.html examples.html logo.html; do
            test -s "help/$f" || { echo "::error::missing or empty help/$f"; exit 1; }
          done

      - name: Upload generated docs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cql-manual
          path: help/
          retention-days: 14

      - name: Generate CQL examples site
        run: ./gradlew generateExamples

      - name: Verify examples generated properly
        run: |
          set -euo pipefail
          test -d examples || { echo "::error::examples/ was not produced"; exit 1; }
          test -s examples/index.html || { echo "::error::missing or empty examples/index.html"; exit 1; }
          test -s examples/Employees.html || { echo "::error::missing or empty examples/Employees.html"; exit 1; }

      # Each example's output must equal what CQL computes today, recorded in .github/examples/expected.
      # After an intended change, regenerate it with the same command and --update.
      - name: Compare the examples with their expected output
        run: python3 -B .github/scripts/check_examples.py examples .github/examples/expected

      - name: Upload generated examples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cql-examples
          path: examples/
          retention-days: 14

  # Runs the built-in JDBCSQL example against each database of the round-trip harness in #120,
  # pointed at it as the example's comments describe, and compares the page with
  # .github/databases/expected/<database>. The servers run in Docker, started by the script, which
  # runs the same way locally.
  databases:
    name: Database (${{ matrix.database }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        database: [h2, sqlite, postgresql, mysql, mariadb, sqlserver]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4

      - name: Compile
        run: ./gradlew classes

      - name: Run the database tests
        run: python3 -B .github/scripts/run_database_tests.py ${{ matrix.database }}

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-results-${{ matrix.database }}
          path: build/database-tests/${{ matrix.database }}/
          retention-days: 14

  # Releases cql.jar for every green push to master. The version is the UTC date (20261015), with
  # a counter for later releases on the same day (20261015.2). The notes group the commits since
  # the latest release by conventional commit type, as configured in .github/cliff.toml.
  release:
    name: Release
    if: github.event_name == 'push' && github.repository == 'CategoricalData/CQL'
    needs: [test, checkstyle, javac, spotbugs, spotless, docs, databases]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    env:
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
      - uses: gradle/actions/setup-gradle@v4

      - name: Pick the version
        id: version
        run: |
          set -euo pipefail
          previous=$(gh release view --json tagName --jq .tagName)
          # A re-run of a job whose commit is already released.
          if [ "$(git rev-list --count "$previous..HEAD")" -eq 0 ]; then
            echo "No commits since $previous, nothing to release."
            exit 0
          fi
          day=$(date -u +%Y%m%d)
          version=$day
          count=1
          while git rev-parse --quiet --verify "refs/tags/$version" > /dev/null; do
            count=$((count + 1))
            version=$day.$count
          done
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Build cql.jar
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          ./gradlew shadowJar -PreleaseVersion="$VERSION"
          cp "build/libs/CQL-$VERSION-all.jar" "$RUNNER_TEMP/cql.jar"

      - uses: actions/setup-node@v4
        if: steps.version.outputs.version
        with:
          node-version: "22"

      - name: Publish the release
        if: steps.version.outputs.version
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          {
            npx --yes git-cliff@2.14.2 --config .github/cliff.toml "$PREVIOUS..HEAD"
            echo
            echo "Full changelog: $REPO_URL/compare/$PREVIOUS...$VERSION"
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$VERSION" "$RUNNER_TEMP/cql.jar" --target "$GITHUB_SHA" \
            --title "$VERSION" --notes-file "$RUNNER_TEMP/notes.md" --latest
